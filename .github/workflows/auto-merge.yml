name: Auto-merge

on:
  # zizmor: ignore[dangerous-triggers] API-only trusted workflow; no pull-request code or artifacts are consumed
  workflow_run:
    workflows:
      - Pull request
    types:
      - completed
  pull_request_review:
    types:
      - submitted

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  merge:
    name: Queue passing pull request
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve eligible pull request
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let pullNumber = context.payload.pull_request?.number
              ?? run?.pull_requests?.[0]?.number
              ?? 0;

            if (!pullNumber && run) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullNumber = associated.data.find(
                pull => pull.base.ref === 'main' && pull.state === 'open',
              )?.number ?? 0;
            }

            if (!pullNumber) {
              core.notice('No open pull request is associated with the successful run.');
              core.setOutput('eligible', 'false');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const validatedHead = run?.head_sha ?? pull.head.sha;
            if (pull.head.sha !== validatedHead) {
              core.notice(`Pull request head ${pull.head.sha} no longer matches validated head ${validatedHead}.`);
              core.setOutput('eligible', 'false');
              return;
            }

            if (!run) {
              const completed = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'pull-request.yml',
                head_sha: pull.head.sha,
                status: 'completed',
                per_page: 100,
              });
              const passed = completed.data.workflow_runs.some(
                candidate => candidate.event === 'pull_request'
                  && candidate.conclusion === 'success'
                  && candidate.head_sha === pull.head.sha,
              );
              if (!passed) {
                core.notice(`No successful Pull request run exists for ${pull.head.sha}.`);
                core.setOutput('eligible', 'false');
                return;
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const latestReviews = new Map();
            for (const review of reviews) {
              if (review.user?.login) latestReviews.set(review.user.login, review);
            }
            const approved = [...latestReviews.values()].some(
              review => review.state === 'APPROVED' && review.commit_id === validatedHead,
            );
            const eligible = pull.state === 'open'
              && !pull.draft
              && pull.base.ref === 'main'
              && approved;
            core.setOutput('eligible', String(eligible));
            core.setOutput('number', String(pull.number));
            core.setOutput('head-sha', validatedHead);

      - name: Enable auto-merge or enter the merge queue
        if: steps.pull-request.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          PULL_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: >-
          gh pr merge "$PULL_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --auto
          --squash
          --match-head-commit "$HEAD_SHA"
