name: Pull request labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # zizmor: ignore[dangerous-triggers] API-only workflow; no pull-request code or artifacts are consumed
      - name: Apply branch and path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          sync-labels: true
