minimum_pre_commit_version: "4.6.1"
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
default_stages:
  - pre-commit
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages:
          - pre-commit
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
          - --no-ensure-ascii
        exclude: '(^|/)packages\.lock\.json$'
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
        files: '(?i)(^NuGet\.Config$|\.(csproj|props|targets|slnx|xml)$)'
        types:
          - text
      - id: check-executables-have-shebangs
        stages:
          - pre-commit
      - id: check-shebang-scripts-are-executable
        stages:
          - pre-commit
      - id: destroyed-symlinks
        stages:
          - pre-commit
      - id: detect-private-key
      - id: forbid-submodules
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
        exclude: '(^|/)packages\.lock\.json$'
        stages:
          - pre-commit
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        stages:
          - pre-commit

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args:
          - --fix

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect staged hard-coded secrets
        args:
          - --config=.gitleaks.toml
        stages:
          - pre-commit
      - id: gitleaks
        alias: gitleaks-repository
        name: Detect hard-coded secrets in repository history
        entry: gitleaks git --redact --verbose
        args:
          - --config=.gitleaks.toml
        stages:
          - manual

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        args:
          - --write-changes
          - --force-exclude
        stages:
          - pre-commit

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args:
          - --verbose
        stages:
          - commit-msg

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --strict-collection

  - repo: local
    hooks:
      - id: nuke-validate
        name: Run authoritative NUKE validation
        entry: dotnet nuke Validate
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
          - manual
